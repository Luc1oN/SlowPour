<!DOCTYPE html>
<html>
<head>
  <script>
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host + '/SlowPour/' +
      '?p=/' + l.pathname.slice(1).split('/').slice(1).join('/') +
      (l.search ? '&q=' + l.search.slice(1) : '') +
      l.hash
    );
  </script>
</head>
</html>
