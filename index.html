    <script>
      // 1. Old links. The app used to live at slowpour.ie/#/lineup. Anything
      //    shared before the site moved still lands here, so send it to /app
      //    before React loads — no flash of the wrong page.
      (function () {
        var h = window.location.hash
        if (h && h.charAt(1) === '/') {
          var path = h.slice(1)
          window.location.replace('/app' + (path === '/' ? '' : path))
        }
      })();

      // 2. Deep app links. GitHub Pages has no file at /app/whiskey/123, so it
      //    serves 404.html, which bounces here with the path in the query
      //    string. Put the real URL back before the router reads it.
      (function (l) {
        if (l.search.charAt(1) === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&') })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location);
    </script>
